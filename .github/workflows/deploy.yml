name: deploy

on:
  push:
    # `eleventy-migration` is here so the work can be previewed on a fork's
    # Pages site before it is merged. Harmless once merged: the branch simply
    # stops existing. A fork's `main` still holds the old Jekyll tree and has
    # no workflow file at all, so nothing runs there.
    branches: [main, eleventy-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is built with a hardcoded path prefix (see the `baseurl` in
      # _data/site.json, eleventy.config.js and src/sass/styles.scss). On GitHub
      # Pages a project site is served from /<repository-name>/, so if the two
      # ever disagree every link and stylesheet on the deployed site breaks with
      # no build error. Fail here instead, with an explanation.
      - name: Check the path prefix matches the repository name
        run: |
          baseurl=$(node -p "require('./_data/site.json').baseurl")
          expected="/${GITHUB_REPOSITORY#*/}"
          if [ "$baseurl" != "$expected" ]; then
            echo "::error::baseurl is '$baseurl' but this repository would deploy to '$expected/'."
            echo "Either rename the repository to '${baseurl#/}', or update the baseurl in"
            echo "_data/site.json, the two filters in eleventy.config.js, and \$logo in"
            echo "src/sass/styles.scss to match."
            exit 1
          fi
          echo "Path prefix '$baseurl' matches the repository name."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Check build
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
